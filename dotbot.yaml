- defaults:
    link:
      relink: true

- clean: ['~', '~/.config/opencode']

# Layout is grouped by app; the link TARGET decides home (~) vs XDG (~/.config).
- link:
    # --- Shell (home-targeted) ---
    ~/.zshrc:
      force: true
      path: zsh/zshrc

    # --- Prompt (XDG-targeted) ---
    ~/.config/starship.toml:
      create: true
      force: true
      path: starship/starship.toml

    # --- Terminal multiplexers / emulators (XDG-targeted) ---
    ~/.config/zellij:
      create: true
      force: true
      path: zellij
    ~/.config/ghostty:
      create: true
      force: true
      path: ghostty

    # --- k9s (XDG-targeted) ---
    ~/.config/k9s:
      create: true
      force: true
      path: k9s

    # --- sofka (XDG-targeted) ---
    ~/.config/sofka:
      create: true
      force: true
      path: sofka

    # --- opencode (XDG-targeted, per-file links so app writes don't touch the repo) ---
    ~/.config/opencode/opencode.jsonc:
      create: true
      force: true
      path: opencode/opencode.jsonc
    ~/.config/opencode/tui.json:
      create: true
      force: true
      path: opencode/tui.json
    ~/.config/opencode/package.json:
      create: true
      force: true
      path: opencode/package.json
    ~/.config/opencode/bun.lock:
      create: true
      force: true
      path: opencode/bun.lock
    # Whole dir linked; plugins other apps drop in (e.g. Orca) are git-ignored.
    ~/.config/opencode/plugins:
      create: true
      force: true
      path: opencode/plugins

    # --- Claude Code statusline (home-targeted) ---
    ~/.claude/statusline-command.sh:
      create: true
      force: true
      path: claude/statusline-command.sh

    # --- agent skills (home-targeted; single source of truth for every AI CLI) ---
    # ~/.agents/skills is the canonical dir; ~/.claude/skills chains onto it so
    # Claude Code and opencode/others see the same skill set.
    ~/.agents/skills:
      create: true
      force: true
      path: agents/skills
    ~/.claude/skills:
      create: true
      force: true
      path: ~/.agents/skills

    # --- zed (XDG-targeted, per-file link so app writes don't touch the repo) ---
    ~/.config/zed/settings.json:
      create: true
      force: true
      path: zed/settings.json

    # --- nvim (XDG-targeted) ---
    ~/.config/nvim:
      create: true
      force: true
      path: nvim

    # --- fastfetch (XDG-targeted) ---
    ~/.config/fastfetch:
      create: true
      force: true
      path: fastfetch

    # --- hammerspoon (home-targeted) ---
    ~/.hammerspoon/init.lua:
      create: true
      force: true
      path: hammerspoon/init.lua

    # --- vim (home-targeted) ---
    ~/.vimrc:
      force: true
      path: vim/vimrc

    # --- git (home-targeted) ---
    ~/.gitignore:
      force: true
      path: git/gitignore
    ~/.gitconfig:
      force: true
      path: git/gitconfig

    # --- tmux (home-targeted) ---
    ~/.tmux.conf:
      force: true
      path: tmux/tmux.conf

    # --- terraform (home-targeted; shared provider cache, see plugin_cache_dir) ---
    ~/.terraformrc:
      force: true
      path: terraform/terraformrc

    # --- mackup (repo-root config, unchanged) ---
    ~/.mackup.cfg:
      force: true
      path: .mackup.cfg

- create:
  - ~/Projects
  # Terraform only uses plugin_cache_dir if the directory already exists.
  - ~/.terraform.d/plugin-cache

- if:
    cond: 'test ! $(which brew)'
    met:
    - shell:
      - [/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)", Install Homebrew]

- if:
    cond: 'test ! ~/.vim/autoload/plug.vim'
    met:
    - shell:
      - [curl -fLo ~/.vim/autoload/plug.vim --create-dirs https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim | vim, Install Plug]

- if:
    cond: 'test ! -d ~/.tmux/plugins/tpm'
    met:
    - shell:
      - [git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm, Install tmux plugin manager]

# Only change the login shell when it isn't already zsh (avoids a chsh password prompt on re-runs).
- if:
    cond: 'test "$SHELL" != "$(which zsh)"'
    met:
    - shell:
      - [chsh -s $(which zsh), Set ZSH as default shell]

# Claude Code managed-settings drop-in lives in a root-owned system dir, so dotbot's
# link can't create it; sudo only runs (and prompts) when the symlink is missing.
- if:
    cond: 'test ! -L "/Library/Application Support/ClaudeCode/managed-settings.d/dotfiles.json"'
    met:
    - shell:
      - ['sudo mkdir -p "/Library/Application Support/ClaudeCode/managed-settings.d" && sudo ln -sfn ~/.dotfiles/claude/managed-settings.json "/Library/Application Support/ClaudeCode/managed-settings.d/dotfiles.json"', Link Claude Code managed settings]

# Run only when no plugins beyond tpm itself are installed yet.
# tpm's installer needs a running tmux server (reads TMUX_PLUGIN_MANAGER_PATH via
# run-shell), so bootstrap on an isolated socket that never touches real sessions.
- if:
    cond: 'test -z "$(ls ~/.tmux/plugins 2>/dev/null | grep -v ''^tpm$'')"'
    met:
    - shell:
      - ['tmux -L tpm_bootstrap -f ~/.tmux.conf new-session -d \; run-shell ~/.tmux/plugins/tpm/bindings/install_plugins && sleep 5 ; tmux -L tpm_bootstrap kill-server 2>/dev/null || true', Install tmux plugins]

# Install the Laravel installer only when it isn't already present.
- if:
    cond: 'test ! -f ~/.composer/vendor/bin/laravel && test ! -f ~/.config/composer/vendor/bin/laravel'
    met:
    - shell:
      - [composer global require laravel/installer, Add Laravel as a global composer package]

- shell:
  - [echo 'Mackup restore is commented out by default; uncomment to restore your backed-up app configs', Display mackup restore message]
  # - [mackup restore, Run mackup restore]

